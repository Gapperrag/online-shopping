<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线购物平台</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft YaHei", sans-serif; background: #f4f6f8; color: #1f2933; }
    header { background: #1f2933; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 22px; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; }
    button, input, select, textarea { font: inherit; }
    .nav-btn, .btn { border: 0; border-radius: 4px; padding: 9px 13px; cursor: pointer; background: #2f80ed; color: #fff; }
    .nav-btn { background: transparent; border: 1px solid rgba(255,255,255,.35); }
    .btn.secondary { background: #52616b; }
    .btn.danger { background: #d64545; }
    .btn.small { padding: 6px 9px; font-size: 13px; }
    .container { width: min(1180px, calc(100% - 28px)); margin: 22px auto; }
    .toolbar, .panel { background: #fff; border: 1px solid #d9e2ec; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
    .toolbar { display: grid; grid-template-columns: 1fr 180px auto; gap: 10px; align-items: end; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .card { background: #fff; border: 1px solid #d9e2ec; border-radius: 6px; overflow: hidden; }
    .card img { width: 100%; height: 150px; object-fit: cover; background: #d9e2ec; display: block; }
    .card-body { padding: 13px; }
    .muted { color: #66788a; font-size: 13px; }
    .price { color: #c0392b; font-weight: 700; margin: 8px 0; }
    .product-card { cursor: pointer; }
    .product-detail { display: grid; grid-template-columns: minmax(260px, 420px) 1fr; gap: 20px; align-items: start; }
    .product-detail img { width: 100%; border-radius: 6px; border: 1px solid #d9e2ec; background: #d9e2ec; }
    .auth-error { display: none; background: #fde2e2; color: #9b1c1c; border-radius: 4px; padding: 10px; margin: 8px 0 14px; }
    .order-products { font-weight: 700; margin-bottom: 4px; }
    .order-number { font-size: 12px; color: #66788a; word-break: break-all; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { display: block; font-size: 13px; color: #52616b; margin-bottom: 5px; }
    input, select, textarea { width: 100%; border: 1px solid #bcccdc; border-radius: 4px; padding: 9px; background: #fff; }
    textarea { min-height: 72px; resize: vertical; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e6edf3; vertical-align: top; }
    th { background: #f0f4f8; }
    .alert { padding: 11px 13px; border-radius: 4px; margin-bottom: 14px; }
    .alert.ok { background: #dff3e3; color: #1f6f3d; }
    .alert.err { background: #fde2e2; color: #9b1c1c; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.55); padding: 24px; overflow: auto; }
    .modal-content { background: #fff; border-radius: 6px; padding: 20px; width: min(460px, 100%); margin: 7vh auto; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .tabs .btn { background: #52616b; }
    .bars { display: grid; gap: 8px; }
    .bar { display: grid; grid-template-columns: 90px 1fr 90px; align-items: center; gap: 8px; }
    .bar span:nth-child(2) { height: 18px; background: #d9e2ec; border-radius: 3px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: #2f80ed; }
    .screen { background: #0f172a; color: #e6edf3; border-color: #1e293b; }
    .screen h2, .screen h3 { color: #fff; }
    .screen-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .chart { min-height: 300px; background: #111827; border: 1px solid #334155; border-radius: 6px; padding: 8px; }
    .metric { background: #111827; border: 1px solid #334155; border-radius: 6px; padding: 16px; }
    @media (max-width: 760px) {
      .toolbar, .split { grid-template-columns: 1fr; }
      .screen-grid { grid-template-columns: 1fr; }
      .product-detail { grid-template-columns: 1fr; }
      header { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <h1>在线购物平台</h1>
    <nav>
      <button class="nav-btn" onclick="showProducts()">商品</button>
      <button class="nav-btn" onclick="showCart()">购物车 <span id="cartCount">0</span></button>
      <button class="nav-btn" onclick="showOrders()">订单</button>
      <button class="nav-btn" id="profileBtn" onclick="showProfile()" style="display:none">用户画像</button>
      <button class="nav-btn" id="staffBtn" onclick="showStaffConsole()" style="display:none">销售后台</button>
      <button class="nav-btn" id="adminBtn" onclick="showAdminConsole()" style="display:none">管理后台</button>
      <button class="nav-btn" id="authBtn" onclick="openAuth()">登录</button>
    </nav>
  </header>

  <main class="container">
    <div id="alert"></div>
    <section id="content"></section>
  </main>

  <div id="authModal" class="modal">
    <div class="modal-content">
      <div class="row" style="justify-content:space-between">
        <h2 id="authTitle">登录</h2>
        <button class="btn secondary small" onclick="closeAuth()">关闭</button>
      </div>
      <form id="authForm">
        <div id="authError" class="auth-error"></div>
        <div id="registerOnly" style="display:none">
          <label>用户名</label>
          <input id="username">
          <label>姓名</label>
          <input id="fullName">
          <label>邮箱</label>
          <input id="registerEmail" type="email">
        </div>
        <div id="loginOnly">
          <label>邮箱或用户名</label>
          <input id="emailOrUsername">
        </div>
        <label>密码</label>
        <input id="password" type="password" required>
        <button class="btn" style="width:100%; margin-top:12px">提交</button>
      </form>
      <button class="btn secondary" style="width:100%; margin-top:10px" onclick="toggleAuthMode()" id="toggleAuth">没有账号，去注册</button>
    </div>
  </div>

  <script>
    const API = '/api';
    let token = localStorage.getItem('token');
    let role = localStorage.getItem('role');
    let registering = false;
    let currentProducts = [];
    let currentBrowseSession = null;

    const $ = (id) => document.getElementById(id);
    const authHeaders = () => ({ Authorization: `Bearer ${token}` });
    const defaultProductImage = 'https://placehold.co/500x300/e6edf3/52616b?text=Product';
    const defaultDetailImage = 'https://placehold.co/700x480/e6edf3/52616b?text=Product';

    function escapeAttr(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function productImage(product, detail = false) {
      return escapeAttr(product.image_url || (detail ? defaultDetailImage : defaultProductImage));
    }
    const money = (value) => `¥${Number(value || 0).toFixed(2)}`;

    function alertMsg(message, ok = true) {
      $('alert').innerHTML = `<div class="alert ${ok ? 'ok' : 'err'}">${message}</div>`;
      setTimeout(() => $('alert').innerHTML = '', 3500);
    }

    async function api(path, options = {}) {
      const response = await fetch(`${API}${path}`, {
        ...options,
        headers: {
          ...(options.body ? { 'Content-Type': 'application/json' } : {}),
          ...(token ? authHeaders() : {}),
          ...(options.headers || {})
        }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || '请求失败');
      return data;
    }

    function flushProductBrowse() {
      if (!currentBrowseSession) return;
      const session = currentBrowseSession;
      currentBrowseSession = null;
      const durationSeconds = Math.max(1, Math.round((Date.now() - session.startedAt) / 1000));
      fetch(`${API}/analytics/browse`, {
        method: 'POST',
        keepalive: true,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? authHeaders() : {})
        },
        body: JSON.stringify({
          productId: session.productId,
          category: session.category,
          durationSeconds
        })
      }).catch(() => {});
    }

    function startProductBrowse(product) {
      flushProductBrowse();
      currentBrowseSession = {
        productId: product.id,
        category: product.category,
        startedAt: Date.now()
      };
    }

    function syncNav() {
      $('authBtn').textContent = token ? `注销 (${role})` : '登录';
      $('authBtn').onclick = token ? logout : openAuth;
      $('profileBtn').style.display = token ? 'inline-block' : 'none';
      $('staffBtn').style.display = ['sales', 'admin'].includes(role) ? 'inline-block' : 'none';
      $('adminBtn').style.display = role === 'admin' ? 'inline-block' : 'none';
      updateCartCount();
    }

    function openAuth() {
      registering = false;
      resetAuthForm();
      renderAuthMode();
      showAuthError('');
      $('authModal').style.display = 'block';
    }

    function closeAuth() {
      $('authModal').style.display = 'none';
    }

    function toggleAuthMode() {
      registering = !registering;
      renderAuthMode();
    }

    function renderAuthMode() {
      $('authTitle').textContent = registering ? '注册用户' : '登录';
      showAuthError('');
      $('registerOnly').style.display = registering ? 'block' : 'none';
      $('loginOnly').style.display = registering ? 'none' : 'block';
      $('toggleAuth').textContent = registering ? '已有账号，去登录' : '没有账号，去注册';
    }

    function resetAuthForm() {
      $('authForm').reset();
      $('username').value = '';
      $('fullName').value = '';
      $('registerEmail').value = '';
      $('emailOrUsername').value = '';
      $('password').value = '';
      showAuthError('');
    }

    function showAuthError(message) {
      const box = $('authError');
      box.textContent = message || '';
      box.style.display = message ? 'block' : 'none';
    }

    $('authForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        const data = registering
          ? await api('/auth/register', {
              method: 'POST',
              body: JSON.stringify({
                username: $('username').value,
                fullName: $('fullName').value,
                email: $('registerEmail').value,
                password: $('password').value
              })
            })
          : await api('/auth/login', {
              method: 'POST',
              body: JSON.stringify({
                emailOrUsername: $('emailOrUsername').value,
                password: $('password').value
              })
            });

        token = data.token;
        role = data.role || data.user?.role;
        localStorage.setItem('token', token);
        localStorage.setItem('role', role);
        resetAuthForm();
        closeAuth();
        syncNav();
        alertMsg('登录成功');
        showProducts();
      } catch (error) {
        showAuthError(error.message);
      }
    });

    function logout() {
      flushProductBrowse();
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      token = null;
      role = null;
      registering = false;
      resetAuthForm();
      syncNav();
      showProducts();
    }

    async function showProducts() {
      flushProductBrowse();
      const [products, categories] = await Promise.all([api('/products'), api('/categories')]);
      $('content').innerHTML = `
        <div class="toolbar">
          <div><label>搜索商品</label><input id="keyword" placeholder="输入商品名称或描述"></div>
          <div><label>类别</label><select id="category"><option value="">全部类别</option>${categories.map(c => `<option>${c.name}</option>`).join('')}</select></div>
          <button class="btn" onclick="searchProducts()">查询</button>
        </div>
        <div id="productsGrid" class="grid">${renderProducts(products)}</div>
      `;
    }

    function renderProducts(products) {
      if (!products.length) return '<div class="panel">暂无商品</div>';
      return products.map(product => `
        <article class="card product-card" onclick="showProductDetail(${product.id})">
          <img src="${productImage(product)}" alt="${escapeAttr(product.name)}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${defaultProductImage}'">
          <div class="card-body">
            <strong>${product.name}</strong>
            <div class="muted">${product.category || '未分类'} | 库存 ${product.stock_quantity}</div>
            <div class="price">${money(product.price)}</div>
            <p class="muted">${product.description || ''}</p>
            <button class="btn" style="width:100%" onclick="event.stopPropagation(); addToCart(${product.id})">加入购物车</button>
          </div>
        </article>
      `).join('');
    }

    async function showProductDetail(productId) {
      flushProductBrowse();
      const [products, recommendations, likes] = await Promise.all([
        api('/products'),
        api(`/recommendations/also-bought/${productId}`),
        token ? api('/likes').catch(() => []) : Promise.resolve([])
      ]);
      const product = products.find(item => item.id === productId);
      if (!product) return alertMsg('商品不存在', false);
      startProductBrowse(product);
      const liked = likes.some(item => item.id === productId);
      $('content').innerHTML = `
        <button class="btn secondary" onclick="showProducts()" style="margin-bottom:14px">返回商品列表</button>
        <section class="panel product-detail">
          <img src="${productImage(product, true)}" alt="${escapeAttr(product.name)}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${defaultDetailImage}'">
          <div>
            <h2>${product.name}</h2>
            <p class="muted">${product.category || '未分类'}</p>
            <div class="price" style="font-size:26px">${money(product.price)}</div>
            <p>库存：${product.stock_quantity}</p>
            <p>${product.description || '暂无详细描述。'}</p>
            <div class="row">
              <button class="btn" onclick="addToCart(${product.id})">加入购物车</button>
              <button class="btn secondary" onclick="${liked ? `toggleLike(${product.id}, false)` : `toggleLike(${product.id}, true)`}">
                ${liked ? '取消喜欢' : '喜欢'}
              </button>
              <button class="btn secondary" onclick="showCart()">查看购物车</button>
            </div>
          </div>
        </section>
        <section class="panel">
          <h3>相关推荐</h3>
          <div class="grid">${renderProducts(recommendations)}</div>
        </section>
      `;
    }

    async function toggleLike(productId, shouldLike) {
      if (!token) return openAuth();
      try {
        await api(`/likes/${productId}`, { method: shouldLike ? 'POST' : 'DELETE' });
        alertMsg(shouldLike ? '已喜欢' : '已取消喜欢');
        showProductDetail(productId);
      } catch (error) {
        alertMsg(error.message, false);
      }
    }

    async function searchProducts() {
      const query = new URLSearchParams({ keyword: $('keyword').value, category: $('category').value });
      const products = await api(`/products/search?${query.toString()}`);
      $('productsGrid').innerHTML = renderProducts(products);
    }

    async function addToCart(productId) {
      if (!token) return openAuth();
      if (role === 'sales') return alertMsg('销售人员不能下单，请使用用户账号购买', false);
      try {
        await api('/cart', { method: 'POST', body: JSON.stringify({ productId, quantity: 1 }) });
        alertMsg('已加入购物车');
        updateCartCount();
        if (currentBrowseSession?.productId === productId) showProductDetail(productId);
      } catch (error) {
        alertMsg(error.message, false);
      }
    }

    async function updateCartCount() {
      if (!token || role === 'sales') {
        $('cartCount').textContent = '0';
        return;
      }
      try {
        const cart = await api('/cart');
        $('cartCount').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
      } catch (_) {
        $('cartCount').textContent = '0';
      }
    }

    async function showCart() {
      if (!token) return openAuth();
      const cart = await api('/cart');
      const total = cart.reduce((sum, item) => sum + Number(item.price) * item.quantity, 0);
      $('content').innerHTML = `
        <div class="panel">
          <h2>购物车</h2>
          ${cart.length ? `
            <table>
              <tr><th>商品</th><th>数量</th><th>小计</th><th></th></tr>
              ${cart.map(item => `<tr><td>${item.name}</td><td>${item.quantity}</td><td>${money(item.price * item.quantity)}</td><td><button class="btn danger small" onclick="removeCart(${item.productId})">删除</button></td></tr>`).join('')}
            </table>
            <h3>合计：${money(total)}</h3>
            <div class="split">
              <div><label>收货地址</label><textarea id="address" required></textarea></div>
              <div><label>付款方式</label><select id="payment"><option value="alipay">支付宝</option><option value="wechat">微信支付</option><option value="card">银行卡</option></select></div>
            </div>
            <button class="btn" style="margin-top:12px" onclick="checkout()">付款并确认</button>
          ` : '<p>购物车为空</p>'}
        </div>
      `;
    }

    async function removeCart(productId) {
      await api(`/cart/${productId}`, { method: 'DELETE' });
      showCart();
      updateCartCount();
    }

    async function checkout() {
      try {
        const order = await api('/orders', {
          method: 'POST',
          body: JSON.stringify({ shippingAddress: $('address').value, paymentMethod: $('payment').value })
        });
        await api(`/orders/${order.orderId}/pay`, { method: 'PUT', body: JSON.stringify({}) });
        alertMsg('付款成功，系统已发送订单确认邮件');
        updateCartCount();
        showOrders();
      } catch (error) {
        alertMsg(error.message, false);
      }
    }

    async function showOrders() {
      if (!token) return openAuth();
      const orders = await api('/orders');
      const details = await Promise.all(orders.map(order => api(`/orders/${order.id}`).catch(() => ({ items: [] }))));
      const ordersWithItems = orders.map((order, index) => ({ ...order, items: details[index].items || [] }));
      $('content').innerHTML = `
        <div class="panel">
          <h2>订单</h2>
          <table>
            <tr><th>订单信息</th><th>用户</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th></tr>
            ${ordersWithItems.map(order => `
              <tr>
                <td>
                  <div class="order-products">${formatOrderItems(order.items)}</div>
                  <div class="order-number">${order.order_number}</div>
                </td>
                <td>${order.username || '-'}</td>
                <td>${money(order.total_amount)}</td>
                <td>${orderStatusText(order.status)}</td>
                <td>${new Date(order.created_at).toLocaleString()}</td>
                <td>
                  ${['sales', 'admin'].includes(role) ? staffStatusSelect(order) : customerOrderActions(order)}
                </td>
              </tr>`).join('')}
          </table>
        </div>
      `;
    }

    function formatOrderItems(items) {
      if (!items || !items.length) return '暂无商品明细';
      return items.map(item => `${item.name}*${item.quantity}`).join('，');
    }

    function orderStatusText(status) {
      return {
        pending: '待付款',
        paid: '已付款',
        shipped: '已发货',
        delivered: '已完成',
        cancelled: '已取消'
      }[status] || status;
    }

    async function showProfile() {
      if (!token) return openAuth();
      const [profile, rec] = await Promise.all([
        api('/analytics/profile'),
        api('/recommendations/collaborative')
      ]);
      $('content').innerHTML = `
        <div class="panel">
          <h2>用户画像</h2>
          <div class="grid">
            <div class="panel"><h3>地域</h3><strong>${profile.region}</strong></div>
            <div class="panel"><h3>购买力</h3><strong>${profile.purchasingPower}</strong><p class="muted">累计 ${money(profile.spend.total_spend)}</p></div>
            <div class="panel"><h3>偏好分类</h3><strong>${profile.favoriteCategory}</strong></div>
          </div>
          <h3>分类偏好</h3>
          ${renderBars(profile.categorySpend.map(x => ({ label: x.category, value: Number(x.quantity) })))}
          <h3>喜欢过的商品</h3>
          <div class="grid">${renderProducts(profile.likedProducts || [])}</div>
          <h3>协同过滤推荐</h3>
          <p class="muted">推荐策略：${rec.strategy}；参考分类：${(rec.categories || []).join('、') || '热门商品'}</p>
          <div class="grid">${renderProducts(rec.products || [])}</div>
        </div>
      `;
    }

    function renderBars(rows) {
      if (!rows.length) return '<p class="muted">暂无数据</p>';
      const max = Math.max(...rows.map(row => row.value), 1);
      return `<div class="bars">${rows.map(row => `
        <div class="bar">
          <strong>${row.label}</strong>
          <span><i style="width:${Math.max(4, row.value / max * 100)}%"></i></span>
          <em>${Math.round(row.value)}</em>
        </div>
      `).join('')}</div>`;
    }

    function customerOrderActions(order) {
      return ['pending', 'paid'].includes(order.status)
        ? `<button class="btn danger small" onclick="cancelOrder(${order.id})">取消</button>`
        : '';
    }

    function staffStatusSelect(order) {
      return `
        <select onchange="updateOrderStatus(${order.id}, this.value)">
          <option value="">更改状态</option>
          <option value="paid">已付款</option>
          <option value="shipped">已发货</option>
          <option value="delivered">已完成</option>
          <option value="cancelled">已取消</option>
        </select>
      `;
    }

    async function cancelOrder(id) {
      await api(`/orders/${id}/cancel`, { method: 'PUT', body: JSON.stringify({}) });
      alertMsg('订单已取消');
      showOrders();
    }

    async function updateOrderStatus(id, status) {
      if (!status) return;
      await api(`/orders/${id}/status`, { method: 'PUT', body: JSON.stringify({ status }) });
      alertMsg('订单状态已更新');
      showOrders();
    }

    async function showStaffConsole() {
      if (!['sales', 'admin'].includes(role)) return alertMsg('权限不足', false);
      $('content').innerHTML = `
        <div class="panel">
          <h2>销售后台</h2>
          <div class="tabs">
            <button class="btn" onclick="showProductAdmin()">商品信息</button>
            <button class="btn" onclick="showCategoryAdmin()">商品类别</button>
            <button class="btn" onclick="showDataExchange('staffContent')">导入导出</button>
            <button class="btn" onclick="showSalesStatus()">销售状态</button>
            <button class="btn" onclick="showLogs()">浏览购买日志</button>
            <button class="btn" onclick="showBigDataMonitor()">大数据监控</button>
          </div>
          <div id="staffContent"></div>

              <option value="csv">CSV</option>
              <option value="json">JSON</option>
            </select>
            <label>导入内容</label>
            <textarea id="importText" style="min-height:220px"></textarea>
            <button class="btn" style="margin-top:10px">执行导入</button>
          </form>

      `;
      window.importPlaceholders = { csv: csvImportPlaceholder, json: jsonImportPlaceholder };
      updateImportPlaceholder();
    }

    function updateImportPlaceholder() {
      const format = $('importFormat')?.value || 'csv';
      const textarea = $('importText');
      if (textarea) textarea.placeholder = window.importPlaceholders?.[format] || '';
    }

    async function exportData() {
      const dataset = $('exportDataset').value;
      const format = $('exportFormat').value;
      try {
        const response = await fetch(`${API}/export/${dataset}?format=${format}`, {
          headers: token ? authHeaders() : {}
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || '导出失败');
        }
        const blob = await response.blob();
        const disposition = response.headers.get('Content-Disposition') || '';
        const match = disposition.match(/filename="?([^"]+)"?/);
        const filename = match ? match[1] : `${dataset}.${format}`;
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        alertMsg('导出文件已生成');
      } catch (error) {
        alertMsg(error.message, false);
      }
    }

    async function importProducts(event) {
      event.preventDefault();
      const format = $('importFormat').value;
      const text = $('importText').value;
      if (!text.trim()) return alertMsg('请输入要导入的内容', false);
      try {
        const body = format === 'json' ? JSON.stringify(JSON.parse(text)) : text;
        const response = await fetch(`${API}/import/products?format=${format}`, {
          method: 'POST',
          headers: {
            'Content-Type': format === 'json' ? 'application/json' : 'text/csv; charset=utf-8',
            ...(token ? authHeaders() : {})
          },
          body
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || '导入失败');
        alertMsg(`${result.message}：成功 ${result.imported}，跳过 ${result.skipped}`);
        $('importText').value = '';
      } catch (error) {
        alertMsg(error.message, false);
      }
    }

    window.onclick = (event) => {
      if (event.target === $('authModal')) closeAuth();
    };

    window.addEventListener('beforeunload', flushProductBrowse);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flushProductBrowse();
    });

    syncNav();
    showProducts().catch(error => alertMsg(error.message, false));
  </script>
